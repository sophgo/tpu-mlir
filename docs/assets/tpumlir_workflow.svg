        <line x1="660" y1="705" x2="688" y2="705" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="696" y="708" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary output</text>
      </svg>
