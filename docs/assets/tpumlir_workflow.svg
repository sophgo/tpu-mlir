        <!-- Legend strip -->
        <line x1="40" y1="676" x2="744" y2="676" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="692" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="700" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="708" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal output</text>

        <rect x="140" y="700" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="160" y="708" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Compiler tool</text>

        <rect x="248" y="700" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
