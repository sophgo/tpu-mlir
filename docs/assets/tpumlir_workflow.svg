        <rect x="344" y="700" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="364" y="708" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input models</text>

        <rect x="444" y="700" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="464" y="708" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Runtime target</text>

        <line x1="552" y1="705" x2="580" y2="705" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
