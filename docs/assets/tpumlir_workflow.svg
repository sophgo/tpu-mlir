        <!-- Arrows first (behind boxes) -->
        <!-- Main pipeline (top to bottom) -->
        <line x1="360" y1="104" x2="360" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="216" x2="360" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="304" x2="360" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="392" x2="360" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="480" x2="360" y2="504" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="360" y1="568" x2="360" y2="592" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

